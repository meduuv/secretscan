[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="secretscan"
version="0.1.0"
description="Static secret detection for source trees"
requires-python=">=3.10"
[project.scripts]
secretscan="secretscan.cli:main"
[tool.setuptools.packages.find]
where=["src"]
